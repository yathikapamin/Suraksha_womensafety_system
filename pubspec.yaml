name: safenet_ai
description: SafeNet AI – Women Safety System with Multi-Agent MCP Architecture
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_messaging: ^15.2.1
  # Using Cloudinary for storage (free tier) instead of Firebase Storage


  # Maps - OpenStreetMap
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # State Management
  provider: ^6.1.2

  # UI & Animations
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_svg: ^2.0.17
  percent_indicator: ^4.2.3
  fl_chart: ^0.70.2

  # Image & Camera
  image_picker: ^1.1.2

  # Storage & Security
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.4

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Phone / SMS
  url_launcher: ^6.3.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  audioplayers: ^6.1.0
  sensors_plus: ^6.1.1
  noise_meter: ^4.0.0
  speech_to_text: ^6.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  flutter_contacts: ^2.0.2
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/sounds/
